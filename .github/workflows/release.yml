name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, security verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Use Node.js 22.13
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0

      - name: Cache project npm cache
        uses: actions/cache@v6
        with:
          path: .sites-runtime/npm-cache
          key: ${{ runner.os }}-node-22.13-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.13-npm-

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Full code quality verification
        run: npm run check

      - name: Install Chromium for product QA
        run: npx playwright install --with-deps chromium

      - name: Product QA gate
        run: npm run qa:product

      - name: Production dependency vulnerability gate
        run: npm run security:deps

      - name: Full dependency advisory report
        continue-on-error: true
        run: npm run security:deps:all

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf "luach-tfila-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "luach-tfila-${GITHUB_REF_NAME}.tar.gz" > "luach-tfila-${GITHUB_REF_NAME}.tar.gz.sha256"
          sha256sum sbom.cdx.json > sbom.cdx.json.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}"             "luach-tfila-${GITHUB_REF_NAME}.tar.gz"             "luach-tfila-${GITHUB_REF_NAME}.tar.gz.sha256"             "sbom.cdx.json"             "sbom.cdx.json.sha256"             --verify-tag             --generate-notes             --title "${GITHUB_REF_NAME}"
