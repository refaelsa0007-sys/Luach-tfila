name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Use Node.js 22.13
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Cache project npm cache
        uses: actions/cache@v4
        with:
          path: .sites-runtime/npm-cache
          key: ${{ runner.os }}-node-22.13-npm-${{ hashFiles('.package-lock-parts/**', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22.13-npm-

      - name: Install locked dependencies
        run: npm run install:ci

      - name: Full verification
        run: npm run check

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          tar -C dist -czf "luach-tfila-${GITHUB_REF_NAME}.tar.gz" .
          sha256sum "luach-tfila-${GITHUB_REF_NAME}.tar.gz" > "luach-tfila-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             "luach-tfila-${GITHUB_REF_NAME}.tar.gz"             "luach-tfila-${GITHUB_REF_NAME}.tar.gz.sha256"             --verify-tag             --generate-notes             --title "${GITHUB_REF_NAME}"
